<!doctype html>
<html lang="pt-BR">
  <head>
    <script>
      (function () {
        var key = "drechsler-theme";
        var stored = localStorage.getItem(key);
        var theme =
          stored === "dark" || stored === "light"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.classList.add(theme);
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DRECHSLER Inovação & Tecnologia Química — inteligência científica para a indústria química e farmacêutica."
    />
    <title>DRECHSLER — Inovação & Tecnologia Química</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
